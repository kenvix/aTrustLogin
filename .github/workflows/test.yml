name: Login tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/bin/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/bin/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q src tests
          bash -n docker/bin/start-with-autologin-actual.sh
      - name: Run unit and browser integration tests
        env:
          ATRUST_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -v
